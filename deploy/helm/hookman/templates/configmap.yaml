apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "hookman.fullname" . }}
  labels:
    {{- include "hookman.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.config.port | quote }}
  WORKER_CONCURRENCY: {{ .Values.config.workerConcurrency | quote }}
  MAX_RETRIES: {{ .Values.config.maxRetries | quote }}
  REQUEST_TIMEOUT: {{ .Values.config.requestTimeout | quote }}
  POLL_INTERVAL: {{ .Values.config.pollInterval | quote }}
  METRICS_ENABLED: {{ .Values.config.metricsEnabled | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DASHBOARD_ENABLED: {{ .Values.config.dashboardEnabled | quote }}
  SHUTDOWN_TIMEOUT: {{ .Values.config.shutdownTimeout | quote }}
  RATE_LIMIT_RPS: {{ .Values.config.rateLimitRPS | quote }}
  RATE_LIMIT_BURST: {{ .Values.config.rateLimitBurst | quote }}
